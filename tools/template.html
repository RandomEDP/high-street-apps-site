<!doctype html>
<html><head><meta charset="utf-8">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:720px;height:1280px;overflow:hidden;font-family:Inter,'Noto Color Emoji',sans-serif;-webkit-font-smoothing:antialiased}
body{background:var(--bg);color:#fff;position:relative}
.bgblob{position:absolute;border-radius:50%;filter:blur(60px);opacity:.55}
#top{position:absolute;top:58px;left:0;right:0;text-align:center}
#top .k{font-size:17px;letter-spacing:.18em;text-transform:uppercase;opacity:.75;font-weight:600}
#top .t{font-size:38px;font-weight:800;margin-top:8px;letter-spacing:-.02em}
#cap{position:absolute;bottom:70px;left:60px;right:60px;text-align:center;font-size:27px;font-weight:600;line-height:1.3;min-height:72px;transition:opacity .35s, transform .35s}
#cap.hide{opacity:0;transform:translateY(12px)}
#phoneWrap{position:absolute;left:50%;top:170px;transform:translateX(-50%) scale(1.3);transform-origin:top center}
#phone{width:330px;height:690px;border-radius:52px;background:#0b0b0d;padding:11px;box-shadow:0 40px 80px rgba(0,0,0,.45),0 0 0 2px rgba(255,255,255,.12) inset;position:relative}
#scr{width:100%;height:100%;border-radius:42px;overflow:hidden;background:var(--paper);position:relative;color:var(--ink)}
.island{position:absolute;top:10px;left:50%;transform:translateX(-50%);width:96px;height:28px;background:#000;border-radius:20px;z-index:30}
.sb{position:absolute;top:0;left:0;right:0;height:46px;display:flex;justify-content:space-between;align-items:center;padding:4px 26px 0;font-size:13px;font-weight:600;z-index:25;color:var(--ink);background:var(--paper)}
#track{position:absolute;top:0;left:0;height:100%;display:flex;transition:transform .55s cubic-bezier(.65,0,.35,1)}
.screen{width:308px;height:100%;overflow:hidden;position:relative}
.inner{padding:54px 16px 90px;transition:transform 1.4s cubic-bezier(.45,0,.2,1)}
.tabs{position:absolute;bottom:0;left:0;right:0;height:74px;background:var(--paper);border-top:1px solid rgba(0,0,0,.07);display:flex;justify-content:space-around;padding:8px 6px 0;z-index:20}
.tab{display:flex;flex-direction:column;align-items:center;font-size:10px;font-weight:600;color:#9a9a9a;gap:3px;width:62px;transition:color .3s}
.tab .i{font-size:20px;filter:grayscale(1);opacity:.6;transition:all .3s}
.tab.on{color:var(--brand)}.tab.on .i{filter:none;opacity:1}
.home-ind{position:absolute;bottom:6px;left:50%;transform:translateX(-50%);width:110px;height:4px;border-radius:3px;background:#111;z-index:21}
#tap{position:absolute;width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.55);border:2px solid rgba(0,0,0,.25);z-index:40;pointer-events:none;opacity:0;transform:scale(.5);transition:opacity .2s,transform .25s}
#tap.go{opacity:1;transform:scale(1)}
#notif{position:absolute;top:-90px;left:10px;right:10px;background:rgba(250,250,250,.96);border-radius:20px;padding:12px 14px;display:flex;gap:10px;z-index:35;box-shadow:0 8px 28px rgba(0,0,0,.25);transition:top .5s cubic-bezier(.2,1.3,.4,1);color:#111}
#notif.show{top:52px}
#notif .ic{width:36px;height:36px;border-radius:9px;background:var(--brand);display:flex;align-items:center;justify-content:center;font-size:19px;flex:none}
#notif b{font-size:13px;display:block}#notif span{font-size:12.5px;line-height:1.3;color:#333}
#splash{position:absolute;inset:0;background:var(--brand);z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--onbrand);transition:opacity .5s}
#splash .lg{font-size:58px}#splash .nm{font-size:26px;font-weight:800;margin-top:12px;text-align:center;padding:0 20px;letter-spacing:-.02em}
#splash .tg{font-size:13px;opacity:.8;margin-top:6px}
#outro{position:absolute;inset:0;background:var(--bg);z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;opacity:0;transition:opacity .6s;text-align:center;padding:0 70px}
#outro.show{opacity:1}
#outro .a{font-size:60px}#outro .b{font-size:44px;font-weight:800;margin-top:18px;letter-spacing:-.02em;line-height:1.1}
#outro .c{font-size:24px;margin-top:20px;opacity:.85;line-height:1.4}
#outro .d{font-size:18px;margin-top:46px;opacity:.6;letter-spacing:.12em;text-transform:uppercase}
/* components */
h1{font-size:25px;font-weight:800;letter-spacing:-.02em;line-height:1.15}
h2{font-size:15px;font-weight:700;margin:18px 0 9px}
.sub{font-size:12.5px;color:var(--muted);margin-top:3px}
.hero{border-radius:20px;padding:16px;background:var(--brand);color:var(--onbrand);margin-top:14px;position:relative;overflow:hidden}
.hero .em{position:absolute;right:-6px;bottom:-12px;font-size:76px;opacity:.95}
.hero .l{font-size:11px;text-transform:uppercase;letter-spacing:.1em;opacity:.8;font-weight:700}
.hero .v{font-size:21px;font-weight:800;margin-top:4px;max-width:70%}
.hero .s{font-size:12px;opacity:.85;margin-top:5px;max-width:68%}
.btn{display:inline-block;margin-top:12px;background:var(--onbrand);color:var(--brand);font-weight:700;font-size:12.5px;padding:8px 14px;border-radius:30px}
.btn.solid{background:var(--brand);color:var(--onbrand)}
.card{background:var(--card);border-radius:16px;padding:12px;margin-bottom:9px;display:flex;align-items:center;gap:11px}
.card .e{width:44px;height:44px;border-radius:12px;background:var(--tint);display:flex;align-items:center;justify-content:center;font-size:23px;flex:none}
.card .m{flex:1;min-width:0}.card .m b{font-size:13.5px;display:block}.card .m span{font-size:11.5px;color:var(--muted)}
.card .r{font-size:13px;font-weight:700;color:var(--brand);text-align:right}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.chip{font-size:11.5px;font-weight:600;padding:6px 10px;border-radius:20px;background:var(--tint);color:var(--ink)}
.chip.on{background:var(--brand);color:var(--onbrand)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.tile{background:var(--card);border-radius:16px;padding:12px;min-height:92px}
.tile .e{font-size:26px}.tile b{display:block;font-size:13px;margin-top:6px}.tile span{font-size:11px;color:var(--muted)}
.row{display:flex;justify-content:space-between;align-items:center;padding:11px 2px;border-bottom:1px solid rgba(0,0,0,.06);font-size:13px}
.tog{width:40px;height:24px;border-radius:14px;background:#ccc;position:relative;transition:background .3s}
.tog::after{content:'';position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .3s}
.tog.on{background:var(--brand)}.tog.on::after{left:19px}
.qr{width:150px;height:150px;margin:14px auto 6px;background:#fff;border-radius:14px;padding:10px;display:grid;grid-template-columns:repeat(15,1fr);gap:1px}
.qr i{background:#111;border-radius:1px}.qr i.o{background:transparent}
.stamps{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:12px}
.stamp{aspect-ratio:1;border-radius:50%;border:2px dashed rgba(255,255,255,.55);display:flex;align-items:center;justify-content:center;font-size:20px}
.stamp.f{background:var(--onbrand);border:none}
.bar{height:8px;border-radius:5px;background:rgba(0,0,0,.08);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--brand);border-radius:5px}
.week{display:flex;gap:6px;margin-top:6px}
.day{flex:1;background:var(--card);border-radius:12px;padding:8px 0;text-align:center;font-size:11px;font-weight:600}
.day b{display:block;font-size:16px;margin-top:2px}
.day.on{background:var(--brand);color:var(--onbrand)}
.day.skip{opacity:.4;text-decoration:line-through}
</style></head>
<body>
<div class="bgblob" style="width:520px;height:520px;left:-160px;top:-120px;background:var(--blob1)"></div>
<div class="bgblob" style="width:520px;height:520px;right:-180px;bottom:-60px;background:var(--blob2)"></div>
<div id="top"><div class="k">App concept</div><div class="t" id="tt"></div></div>
<div id="phoneWrap"><div id="phone"><div id="scr">
  <div class="island"></div>
  <div class="sb"><span>9:41</span><span><span style="letter-spacing:2px">▂▄▆ ◔ ▭</span></span></div>
  <div id="track"></div>
  <div class="tabs" id="tabs"></div>
  <div class="home-ind"></div>
  <div id="notif"><div class="ic" id="nic"></div><div><b id="nt"></b><span id="nb"></span></div></div>
  <div id="splash"><div class="lg" id="slg"></div><div class="nm" id="snm"></div><div class="tg" id="stg"></div></div>
  <div id="tap"></div>
</div></div></div>
<div id="cap" class="hide"></div>
<div id="outro"><div class="a" id="oa"></div><div class="b" id="ob"></div><div class="c" id="oc"></div><div class="d" id="od"></div></div>
<script src="app.js"></script>
<script>
const A=window.APP, $=id=>document.getElementById(id), sleep=ms=>new Promise(r=>setTimeout(r,ms));
const R=document.documentElement.style;
for(const [k,v] of Object.entries(A.vars)) R.setProperty('--'+k,v);
$('tt').textContent=A.name; $('slg').textContent=A.logo; $('snm').textContent=A.name; $('stg').textContent=A.tagline||'';
$('oa').textContent=A.logo; $('ob').innerHTML=A.outro.title; $('oc').innerHTML=A.outro.text; $('od').textContent=A.outro.foot||'';
$('track').innerHTML=A.screens.map(s=>`<div class="screen"><div class="inner">${s.html}</div></div>`).join('');
$('tabs').innerHTML=A.screens.map((s,i)=>`<div class="tab${i?'':' on'}"><div class="i">${s.icon}</div>${s.tab}</div>`).join('');
// QR fill
document.querySelectorAll('.qr').forEach(q=>{let h='';let seed=7;for(let i=0;i<225;i++){seed=(seed*9301+49297)%233280;const x=i%15,y=Math.floor(i/15);const f=(x<4&&y<4)||(x>10&&y<4)||(x<4&&y>10);h+=`<i class="${f?((x%3==0||y%3==0||(x>10&&(x==11||x==14))||(y>10&&(y==11||y==14)))?'':'o'):(seed/233280>.5?'':'o')}"></i>`;}q.innerHTML=h;});
const scr=$('scr').getBoundingClientRect();
async function tapAt(el){const r=el.getBoundingClientRect();const t=$('tap');const s=1.3;
 t.style.left=((r.left+r.width/2-scr.left)/s-22)+'px';t.style.top=((r.top+r.height/2-scr.top)/s-22)+'px';
 t.classList.add('go');await sleep(320);t.classList.remove('go');}
async function cap(t){$('cap').classList.add('hide');await sleep(300);$('cap').innerHTML=t;$('cap').classList.remove('hide');}
async function run(){
 await sleep(400);$('splash').style.opacity=0;await sleep(500);$('splash').style.display='none';
 for(const st of A.steps){
  const tabs=[...document.querySelectorAll('.tab')];
  if(st.screen!==undefined){
   if(st.tap!==false && st.screen!==cur){await tapAt(tabs[st.screen]);}
   tabs.forEach((t,i)=>t.classList.toggle('on',i===st.screen));
   $('track').style.transform=`translateX(${-308*st.screen}px)`;cur=st.screen;
  }
  cap(st.caption);
  await sleep(900);
  if(st.toggle){const el=document.querySelectorAll('.screen')[cur].querySelector(st.toggle);await tapAt(el);el.classList.toggle('on');await sleep(300);}
  if(st.notif){$('nic').textContent=st.notif.icon;$('nt').textContent=st.notif.title;$('nb').textContent=st.notif.body;$('notif').classList.add('show');await sleep(2200);$('notif').classList.remove('show');await sleep(400);}
  if(st.scroll){document.querySelectorAll('.inner')[cur].style.transform=`translateY(${-st.scroll}px)`;await sleep(1500);}
  await sleep(st.dwell||1600);
 }
 $('cap').classList.add('hide');$('outro').classList.add('show');await sleep(3200);
 window.DONE=true;
}
let cur=0;run();
</script></body></html>
